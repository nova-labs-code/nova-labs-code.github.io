<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Redirecting...</title>

    <script>
        const url = window.location.search.substring(2);

        if (url) {
            window.location.replace(url);
        } else {
            document.title = "Invalid Redirect";

            document.body.innerHTML = `
                <h1>Invalid redirect</h1>
                <p>No URL was provided.</p>
            `;
        }
    </script>
</head>

<body>
    Redirecting...
</body>
</html>
