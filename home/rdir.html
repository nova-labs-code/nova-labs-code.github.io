<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Redirecting...</title>

    <script>
        const code = window.location.search.substring(1);

        async function redirect() {

            if (!code) {
                showError("No share code was provided.");
                return;
            }

            try {

                const response = await fetch(
                    "../site-linking.json"
                );

                if (!response.ok) {
                    throw new Error("Could not load site-linking.json");
                }

                const links = await response.json();

                const url = links[code];

                if (url) {
                    window.location.replace(url);
                } else {
                    showError("Invalid share code.");
                }

            } catch (error) {

                console.error(error);

                showError(
                    "Unable to load the redirect information."
                );
            }
        }

        function showError(message) {

            document.title = "Invalid Redirect";

            document.body.innerHTML = `
                <h1>Invalid redirect</h1>
                <p>${message}</p>
            `;
        }

        redirect();
    </script>
</head>

<body>
    Redirecting...
</body>
</html>
