<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Labs</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:40px;
}

.tree{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:40px;
}

.card{
    background:#1e1e1e;
    border:1px solid #444;
    border-radius:12px;
    padding:12px 20px;
    min-width:150px;
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
}

.children{
    display:flex;
    gap:30px;
    justify-content:center;
    flex-wrap:wrap;
}

.branch{
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
}

.branch::before{
    content:"";
    width:2px;
    height:20px;
    background:#666;
}
</style>
</head>
<body>

<div class="tree" id="tree"></div>

<script>
// Paste links here
const links = [
    "https://nova-labs-code.github.io/random-escape/",
    "https://nova-labs-code.github.io/random-escape/chapter1/",
    "https://nova-labs-code.github.io/random-escape/chapter2/",
    "https://nova-labs-code.github.io/tools/admin/",
    "https://nova-labs-code.github.io/tools/party-generator/",
    "https://nova-labs-code.github.io/docs/api/",
    "https://nova-labs-code.github.io/docs/guides/"
];

const root = {
    name: "Nova Labs",
    children: {}
};

for (const link of links) {
    const parts = new URL(link).pathname
        .split("/")
        .filter(Boolean);

    let current = root.children;

    for (const part of parts) {
        if (!current[part]) {
            current[part] = {
                name: part,
                children: {}
            };
        }

        current = current[part].children;
    }
}

function createNode(node) {
    const branch = document.createElement("div");
    branch.className = "branch";

    const card = document.createElement("div");
    card.className = "card";
    card.textContent = node.name;

    branch.appendChild(card);

    const childKeys = Object.keys(node.children);

    if (childKeys.length) {
        const children = document.createElement("div");
        children.className = "children";

        childKeys.forEach(key => {
            children.appendChild(createNode(node.children[key]));
        });

        branch.appendChild(children);
    }

    return branch;
}

document.getElementById("tree")
    .appendChild(createNode(root));
</script>

</body>
</html>
