<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Labs Code</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 40px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    margin-bottom: 40px;
}

.section {
    margin-bottom: 40px;
}

.section-title {
    font-size: 1.5rem;
    margin-bottom: 15px;
    font-weight: bold;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
}

.card {
    display: block;
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 20px;
    text-decoration: none;
    color: white;
    transition: .2s;
}

.card:hover {
    transform: translateY(-4px);
    border-color: #666;
    background: #222;
}

.card-title {
    font-size: 1.1rem;
    font-weight: bold;
    margin-bottom: 8px;
}

.card-path {
    color: #888;
    font-size: 0.85rem;
    word-break: break-all;
}
</style>
</head>
<body>

<h1>Nova Labs</h1>

<div id="content"></div>

<script>
// Add your links here
const links = [
    "MusicPlayer/"
];

const groups = {};

links.forEach(link => {
    const url = new URL(link);

    const parts = url.pathname
        .split("/")
        .filter(Boolean);

    const group = parts[0] || "Home";

    if (!groups[group]) {
        groups[group] = [];
    }

    groups[group].push({
        url: link,
        name:
            parts.length === 0
                ? "Home"
                : parts[parts.length - 1]
                      .replace(/-/g, " ")
                      .replace(/\b\w/g, c => c.toUpperCase()),
        path: url.pathname
    });
});

const container = document.getElementById("content");

Object.keys(groups)
    .sort()
    .forEach(group => {
        const section = document.createElement("div");
        section.className = "section";

        const title = document.createElement("div");
        title.className = "section-title";
        title.textContent =
            group.replace(/-/g, " ")
                 .replace(/\b\w/g, c => c.toUpperCase());

        const grid = document.createElement("div");
        grid.className = "grid";

        groups[group].forEach(item => {
            const card = document.createElement("a");
            card.className = "card";
            card.href = item.url;

            card.innerHTML = `
                <div class="card-title">${item.name}</div>
                <div class="card-path">${item.path}</div>
            `;

            grid.appendChild(card);
        });

        section.appendChild(title);
        section.appendChild(grid);
        container.appendChild(section);
    });
</script>

</body>
</html>
