<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Labs Code</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:40px;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    margin-bottom:40px;
}

.section{
    margin-bottom:40px;
}

.section-title{
    font-size:1.5rem;
    font-weight:bold;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
}

.card{
    display:block;
    background:#1b1b1b;
    border:1px solid #333;
    border-radius:12px;
    padding:20px;
    color:white;
    text-decoration:none;
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
    background:#222;
    border-color:#666;
}

.card-title{
    font-size:1.1rem;
    font-weight:bold;
    text-align:center;
}
</style>
</head>
<body>

<h1>Nova Labs Code</h1>

<div id="content"></div>

<script>

// LINKS NOW USE NAME VALUES
const links = [
    { name: "Music Player", url: "MusicPlayer/" }
];

const groups = {};

links.forEach(link => {

    const isExternal = /^https?:\/\//i.test(link.url);

    let group;

    if (isExternal) {
        group = "External";
    } else {
        const parts = link.url.split("/").filter(Boolean);
        group = parts[0] || "Home";
    }

    if (!groups[group]) {
        groups[group] = [];
    }

    groups[group].push({
        ...link,
        external: isExternal
    });
});

const content = document.getElementById("content");

Object.keys(groups)
    .sort()
    .forEach(group => {

        const section = document.createElement("div");
        section.className = "section";

        const title = document.createElement("div");
        title.className = "section-title";
        title.textContent = group;

        const grid = document.createElement("div");
        grid.className = "grid";

        groups[group].forEach(item => {

            const card = document.createElement("a");
            card.className = "card";
            card.href = item.url;

            if (item.external) {
                card.target = "_blank";
                card.rel = "noopener noreferrer";
            }

            card.innerHTML = `
                <div class="card-title">${item.name}</div>
            `;

            grid.appendChild(card);
        });

        section.appendChild(title);
        section.appendChild(grid);
        content.appendChild(section);
    });

</script>

</body>
</html>
